<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jarvis remote</title>
<link rel="icon" href="/icons/icon.svg">
<style>
  :root { --bg: #0b0e14; --bg2: #141a24; --line: #263042; --text: #e6edf6; --muted: #7f8aa0; --accent: #38bdf8; --bad: #ef4444; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); user-select: none; }
  header { display: flex; gap: 8px; align-items: stretch; }
  button { font: inherit; color: inherit; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; }
  .tap { flex: 2; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 22px; padding: 14px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #243044; }
  .dot.on { background: #7dd3fc; } .dot.one { background: #f472b6; box-shadow: 0 0 14px #f472b6; }
  .bo { flex: 1; background: #3a0d0d; border-color: #7f1d1d; color: #fecaca; font-weight: 900; letter-spacing: .05em; }
  .bo.on { background: var(--bad); color: #fff; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; padding: 12px 6px; font-weight: 700; }
  .row button.on { background: #fbbf24; color: #1f1400; border-color: #fbbf24; }
  .pages { display: flex; gap: 6px; overflow-x: auto; }
  .pages button { padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
  .pages button.on { border-color: var(--accent); color: var(--accent); }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); grid-auto-rows: minmax(76px, 1fr); gap: 8px; overflow: auto; }
  .q { --tint: #94a3b8; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-weight: 700; border-color: color-mix(in srgb, var(--tint) 45%, var(--line)); touch-action: none; }
  .q.on { background: color-mix(in srgb, var(--tint) 70%, #000); color: #fff; }
  .master { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .master input { flex: 1; accent-color: var(--accent); height: 34px; }
  .status { color: var(--muted); font-size: 12px; min-height: 16px; text-align: center; }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 30px 10px; }
</style>
</head>
<body>
  <header>
    <button class="tap" id="tap" aria-label="Tap tempo"><i class="dot" id="dot"></i><span id="bpm">120</span><small style="font-size:12px;color:var(--muted)">BPM · TAP</small></button>
    <button class="bo" id="bo">BLACK<br>OUT</button>
  </header>
  <div class="row">
    <button id="auto">Autopilot</button>
    <button id="next">Next look</button>
    <button id="big">Biggest</button>
  </div>
  <div class="pages" id="pages"></div>
  <div class="grid" id="grid"></div>
  <label class="master">Master <input type="range" id="master" min="0" max="100" value="100"> <span id="mv">100</span></label>
  <div class="status" id="status">connecting…</div>
  <script type="module" src="/remote/remote.js"></script>
</body>
</html>
