name: Desktop app (installers)

# Builds the desktop app with the engine, a Python of its own and the
# offline AI's engine (llama.cpp) inside (nothing to install first) - Jarvis Setup.exe for Windows, Jarvis.dmg for
# Mac - then runs the app check on each built app.  The installer is kept as this run's artifact (Actions -> this
# run -> Artifacts), private to the repo.  Run it by hand (Actions -> this
# workflow -> Run workflow); a pull request that changes desktop/ runs it too.
on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml", "tools/desktopcheck.mjs"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A Python of its own (Windows' embeddable Python; the engine needs only the standard library)
        shell: pwsh
        run: |
          $v = "3.12.10"
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath desktop/build/python
          desktop/build/python/python.exe -c "import sqlite3, json, http.server; print('python ok')"
      - name: The offline AI's engine (llama.cpp's server, latest release; Vulkan runs on any graphics card, else the processor)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R ggml-org/llama.cpp --pattern "*bin-win-vulkan-x64.zip" -O llama.zip
          Expand-Archive llama.zip -DestinationPath desktop/build/llama
          $exe = Get-ChildItem desktop/build/llama -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { throw "no llama-server.exe in the release" }
          & $exe.FullName --version
      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          node stage.mjs
          npx electron-builder --win --publish never
      - name: Check the built app (engine, key, Show mode, safe keys, clean stop)
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-audit --no-fund playwright
          $env:DESKTOP_EXE = (Resolve-Path desktop/dist/win-unpacked/Jarvis.exe).Path
          node tools/desktopcheck.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-installer
          path: desktop/dist/*.exe
          retention-days: 14

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: A Python of its own (python-build-standalone via uv; the engine needs only the standard library)
        run: |
          UV_PYTHON_INSTALL_DIR="$PWD/desktop/build/pyroot" uv python install 3.12
          D=$(ls -d desktop/build/pyroot/cpython-3.12.[0-9]*-*/ | head -n1)     # not the 3.12 shortcut uv also makes
          mv "$D" desktop/build/python
          rm -rf desktop/build/pyroot
          desktop/build/python/bin/python3 -c "import sqlite3, json, http.server, sys; print('python ok', sys.version)"
      - name: The offline AI's engine (llama.cpp's server, latest release; Metal on Apple silicon)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R ggml-org/llama.cpp --pattern "*bin-macos-arm64.zip" -O llama.zip
          mkdir -p desktop/build/llama && unzip -q llama.zip -d desktop/build/llama
          EXE=$(find desktop/build/llama -name llama-server -type f | head -n1)
          test -n "$EXE" || { echo "no llama-server in the release"; exit 1; }
          chmod +x "$EXE" && "$EXE" --version
      - name: Build the app
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          node stage.mjs
          npx electron-builder --mac --publish never
      - name: Check the built app (engine, key, Show mode, phones, safe keys, clean stop)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-audit --no-fund playwright
          DESKTOP_EXE="$(ls -d desktop/dist/mac*/Jarvis.app)/Contents/MacOS/Jarvis" node tools/desktopcheck.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mac-installer
          path: desktop/dist/*.dmg
          retention-days: 14
