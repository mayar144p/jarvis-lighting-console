name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test (engine, HTTP, web modules, picker maths, 3DS parser)
        run: python tools/selftest.py
      - name: A whole gig, rehearsed (build, run, save, reload, compare)
        run: python tools/gigcheck.py
      - name: Odd inputs (empty rig, junk, 520 lights, corrupt shows, restart, undo)
        run: python tools/oddcheck.py

  frame-timing:
    # DMX on a steady beat with a big rig and three screens watching
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Frame timing (286 lights, effects, 3 screens)
        run: python tools/frametiming.py

  library-rules:
    # every light in the fixture libraries against the desk's promises
    # (tools/rulecheck.py): a bug in one light is a rule for all of them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Library rules (about 2,400 lights; fails only on a NEW failure)
        run: python tools/rulecheck.py

  screen-check:
    # the real page in a real browser, the key screens clicked through
    # (tools/uicheck.mjs); the full 63 steps at three widths run nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A browser for the check
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Screen check (key screens, 1440 wide)
        run: >
          node tools/uicheck.mjs screencheck --widths 1440
          --only "^(02-select-all|03-level|04-colour|06-fx|10-move|17-buttons|19-timeline|21-show-menu|23-views-menu|33-settings|35-cmdbar|41-cue-dialog|47-light-test)$"
      - name: Keep the screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screen-check
          path: screencheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: ruff (pyflakes rules)
        run: ruff check --select F app tools
      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo ".env must never be committed"; exit 1
          fi
