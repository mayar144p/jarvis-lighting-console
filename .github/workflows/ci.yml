name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test (engine, HTTP, web modules, picker maths, 3DS parser)
        run: python tools/selftest.py

  frame-timing:
    # DMX on a steady beat with a big rig and three screens watching
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Frame timing (286 lights, effects, 3 screens)
        run: python tools/frametiming.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: ruff (pyflakes rules)
        run: ruff check --select F app tools
      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo ".env must never be committed"; exit 1
          fi
